<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion test</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 1rem;
         font-family: system-ui, sans-serif; background: #111; color: #eee; }
  .row { display: flex; gap: 12px; }
  .box { width: 56px; height: 56px; border-radius: 14px; background: #ffd60a; }
  button { font: inherit; padding: .7rem 1.4rem; border: 0; border-radius: 999px; cursor: pointer; }
  #status { opacity: .7; }
</style>
</head>
<body>
  <div>
    <div class="row"><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div>
    <p id="status">Loading Motion…</p>
    <button id="play">Play again</button>
  </div>
  <!-- Motion (vanilla JS) v13.5.1, saved locally so it works offline -->
  <script src="vendor/motion.js"></script>
  <script>
    const { animate, stagger } = Motion;
    const play = () => animate(".box",
      { y: [40, 0], opacity: [0, 1], rotate: [-90, 0] },
      { delay: stagger(0.1), type: "spring", bounce: 0.4 });
    document.getElementById("status").textContent = "Motion loaded ✔";
    document.getElementById("play").addEventListener("click", play);
    play();
  </script>
</body>
</html>
